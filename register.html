<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>FunMovie • Đăng ký Staff</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1220;
            --panel: #131a2a;
            --panel-2: #171f34;
            --text: #e6e7eb;
            --muted: #9aa4bc;
            --brand: #5b6cff;
            --brand-2: #3847d6;
            --border: #202a45
        }

        html,
        body {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--text)
        }

        .auth-wrap {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px
        }

        .auth-card {
            width: 100%;
            max-width: 520px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35)
        }

        .brand {
            font-weight: 800;
            letter-spacing: .3px;
            background: linear-gradient(90deg, #8ea2ff, #5b6cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 22px
        }

        .muted {
            color: var(--muted)
        }

        .form-control {
            background: #0f1730;
            border: 1px solid var(--border);
            color: var(--text)
        }

        .form-control::placeholder {
            color: #7f89a6
        }

        .btn-brand {
            background: var(--brand);
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 10px 14px
        }

        .btn-brand:hover {
            background: #4a5bff
        }

        .link-muted {
            color: #8ea2ff;
            text-decoration: none
        }

        .link-muted:hover {
            text-decoration: underline
        }

        .chip {
            background: #0f1730;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <div class="brand">HD Movie Staff</div>
                <span class="chip">Đăng ký</span>
            </div>
            <p class="muted mb-3">Tạo tài khoản STAFF mới để truy cập hệ thống.</p>

            <div id="alert" class="alert d-none" role="alert"></div>

            <form id="formRegister" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="full_name" placeholder="Nguyễn Văn A">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone" placeholder="0901234567">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="username" minlength="3"
                            required>
                        <div class="invalid-feedback">Username tối thiểu 3 ký tự.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="staff@funmovie.com" required>
                        <div class="invalid-feedback">Email không hợp lệ.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự"
                            minlength="6" required>
                        <div class="invalid-feedback">Mật khẩu tối thiểu 6 ký tự.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nhập lại mật khẩu</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu"
                            required>
                        <div class="invalid-feedback">Mật khẩu nhập lại chưa khớp.</div>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand w-100 mt-3">Tạo tài khoản</button>
            </form>

            <div class="text-center mt-3">
                <span class="muted">Đã có tài khoản?</span>
                <a class="link-muted" href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api';

        function showAlert(type, msg) { const el = document.getElementById('alert'); el.className = 'alert alert-' + type; el.textContent = msg; el.classList.remove('d-none') }
        function clearAlert() { const el = document.getElementById('alert'); el.className = 'alert d-none'; el.textContent = '' }

        function validateMatch() {
            const pw = document.getElementById('password');
            const cf = document.getElementById('confirmPassword');
            cf.setCustomValidity(cf.value && pw.value !== cf.value ? 'notmatch' : '');
        }
        document.getElementById('password').addEventListener('input', validateMatch);
        document.getElementById('confirmPassword').addEventListener('input', validateMatch);

        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault(); clearAlert();
            const f = e.currentTarget; validateMatch();
            if (!f.checkValidity()) { f.classList.add('was-validated'); return; }

            const payload = {
                username: document.getElementById('username').value.trim().replace(/,+$/, ''),
                email: document.getElementById('email').value.trim().toLowerCase().replace(/,+$/, ''),
                password: document.getElementById('password').value,
                full_name: document.getElementById('full_name').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };

            try {
                const res = await fetch(`${API}/auth/staff/register`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { showAlert('danger', data?.message || data?.error || 'Đăng ký thất bại'); return; }

                const msg = encodeURIComponent('Đăng ký thành công! Vui lòng đăng nhập.');
                location.href = `login.html?registered=1&msg=${msg}`; // quay lại login
            } catch (err) {
                showAlert('danger', 'Không thể kết nối máy chủ');
            }
        });
    </script>
</body>

</html>
