<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>FunMovie • Staff Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./login.css"> <!-- CSS login riêng -->
</head>

<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-title">HD Movie Staff</div>
      <div class="login-subtitle">Đăng nhập hệ thống bán vé</div>

      <div id="alert" class="alert-custom d-none"></div>

      <form id="formLogin" autocomplete="off" novalidate>

        <!-- Fake fields để Chrome autofill vào đây -->
        <input type="text" style="display:none" autocomplete="off">
        <input type="password" style="display:none" autocomplete="off">

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="text" id="email" class="form-control" autocomplete="new-email" placeholder="staff@funmovie.com"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <div class="pw-wrap">
            <input type="text" id="password" class="form-control" autocomplete="new-password" placeholder="••••••"
              required>

            <button type="button" class="pw-eye" id="togglePw">👁</button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-check-label">
            <input type="checkbox" id="remember"> Ghi nhớ đăng nhập
          </label>
          <a href="#" onclick="showMidAlert('Vui lòng liên hệ quản trị viên để đặt lại mật khẩu');return false;">
            Quên mật khẩu?
          </a>

        </div>

        <button class="btn-login" type="submit">Đăng nhập</button>
      </form>

    </div>
  </div>

  <!-- MID ALERT POPUP -->
  <div id="midAlert" class="d-none">
    <div class="mid-alert-box">
      <div id="midAlertMsg">Thông báo</div>
      <button id="midAlertBtn" class="mid-alert-btn">OK</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./login.js"></script>

</body>

</html>
