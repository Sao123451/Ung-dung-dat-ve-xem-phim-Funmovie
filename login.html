<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <title>FunMovie • Đăng nhập Staff</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1220;
      --panel: #131a2a;
      --panel-2: #171f34;
      --text: #e6e7eb;
      --muted: #9aa4bc;
      --brand: #5b6cff;
      --brand-2: #3847d6;
      --border: #202a45
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text)
    }

    .auth-wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .35)
    }

    .brand {
      font-weight: 800;
      letter-spacing: .3px;
      background: linear-gradient(90deg, #8ea2ff, #5b6cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 22px
    }

    .muted {
      color: var(--muted)
    }

    .form-control {
      background: #0f1730;
      border: 1px solid var(--border);
      color: var(--text)
    }

    .form-control::placeholder {
      color: #7f89a6
    }

    .btn-brand {
      background: var(--brand);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px
    }

    .btn-brand:hover {
      background: #4a5bff
    }

    .link-muted {
      color: #8ea2ff;
      text-decoration: none
    }

    .link-muted:hover {
      text-decoration: underline
    }

    .chip {
      background: #0f1730;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px
    }

    .input-group-text {
      background: #0f1730;
      border: 1px solid var(--border);
      color: #9aa4bc;
      cursor: pointer
    }
  </style>
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="brand">HD Movie Staff</div>
        <span class="chip">Đăng nhập</span>
      </div>

      <div id="alert" class="alert d-none" role="alert"></div>

      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="staff@funmovie.com" required>
          <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
        </div>

        <div class="mb-2">
          <label class="form-label">Mật khẩu</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" placeholder="••••••" minlength="6" required>
            <span class="input-group-text" id="togglePw" title="Hiện/ẩn mật khẩu">👁️</span>
          </div>
          <div class="invalid-feedback">Mật khẩu tối thiểu 6 ký tự.</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label muted" for="remember">Ghi nhớ đăng nhập</label>
          </div>
          <a class="link-muted small" href="#"
            onclick="alert('Liên hệ quản trị để đặt lại mật khẩu.');return false;">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-brand w-100">Đăng nhập</button>
      </form>

      <div class="text-center mt-3">
        <span class="muted">Bạn chưa có tài khoản?</span>
        <a class="link-muted" href="register.html">Đăng ký</a>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';
    const HOME_PAGE = 'index.html';  // trang chủ của bạn

    function showAlert(type, msg) { const el = document.getElementById('alert'); el.className = 'alert alert-' + type; el.textContent = msg; el.classList.remove('d-none') }
    function clearAlert() { const el = document.getElementById('alert'); el.className = 'alert d-none'; el.textContent = '' }

    document.getElementById('togglePw').addEventListener('click', () => {
      const ip = document.getElementById('password'); ip.type = ip.type === 'password' ? 'text' : 'password';
    });

    (function () { // thông báo sau khi đăng ký
      const p = new URLSearchParams(location.search);
      if (p.get('registered') === '1') { showAlert('success', decodeURIComponent(p.get('msg') || 'Đăng ký thành công! Vui lòng đăng nhập.')); setTimeout(() => clearAlert(), 5000); }
    })();

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault(); clearAlert();
      const f = e.currentTarget; if (!f.checkValidity()) { f.classList.add('was-validated'); return; }

      const email = document.getElementById('email').value.trim().toLowerCase().replace(/,+$/, '');
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      try {
        const res = await fetch(`${API}/auth/staff/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        let data = {}; try { data = await res.json(); } catch { }
        if (!res.ok) { showAlert('danger', data?.message || data?.error || `Đăng nhập thất bại (HTTP ${res.status})`); return; }

        const { token, user } = data || {};
        if (!token || !user) { showAlert('danger', 'Phản hồi không hợp lệ từ máy chủ'); return; }
        if ((user.role || '').toLowerCase() !== 'staff') { showAlert('danger', 'Tài khoản không phải STAFF'); return; }

        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(user));
        if (!remember) { localStorage.setItem('sessionExpiredAt', String(Date.now() + 2 * 60 * 60 * 1000)); } else { localStorage.removeItem('sessionExpiredAt'); }

        location.href = HOME_PAGE;
      } catch (err) {
        showAlert('danger', 'Không thể kết nối máy chủ');
      }
    });
  </script>
</body>

</html>
