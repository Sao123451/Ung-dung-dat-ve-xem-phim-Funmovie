<div class="tickets-page">

  <!-- ==================== FILTER BAR ==================== -->
  <div class="card filter-bar">
    <div class="row">
      <div class="col-3">
        <label>Trạng thái</label>
        <select id="tk-status">
          <option value="">Tất cả</option>
          <option value="pending">Chờ thanh toán</option>
          <option value="paid">Đã thanh toán</option>
          <option value="cancelled">Đã hủy</option>
        </select>
      </div>

      <div class="col-3">
        <label>Ngày chiếu</label>
        <input id="tk-date" type="date"/>
      </div>

      <div class="col-3">
        <label>Email khách hàng</label>
        <input id="tk-email" placeholder="Nhập email"/>
      </div>

      <div class="col-3">
        <label>Mã vé</label>
        <input id="tk-code" placeholder="Mã đặt vé (reservation_code)"/>
      </div>
    </div>

    <div class="filter-actions">
      <button id="tk-search" class="btn brand">Tìm kiếm</button>
      <button id="tk-reset" class="btn">Làm mới</button>
    </div>
  </div>

  <!-- ==================== TABLE ==================== -->
  <div class="card">
    <table class="table" id="tk-table">
      <thead>
        <tr>
          <th>Mã vé</th>
          <th>Khách hàng</th>
          <th>Phim</th>
          <th>Rạp</th>
          <th>Suất chiếu</th>
          <th>Trạng thái</th>
          <th>Tổng tiền</th>
          <th style="width:110px">Hành động</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="tk-pager" class="pager"></div>
  </div>
</div>
