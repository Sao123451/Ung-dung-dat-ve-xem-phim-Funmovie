<div class="products-page">
  <div class="card products-card">

    <div class="products-head">
      <h3>Bỏng & Nước</h3>

      <div class="products-filters">
        <select id="pd-type" class="pd-select">
          <option value="all">Tất cả loại</option>
          <option value="popcorn">Popcorn</option>
          <option value="drink">Drink</option>
          <option value="combo">Combo</option>
        </select>

        <input id="pd-q" class="search pd-search" placeholder="Tìm tên sản phẩm...">
      </div>
    </div>

    <div id="pd-table" class="table-wrap">
      <div class="muted">Đang tải...</div>
    </div>

    <div class="products-footer">
      <div id="pd-info" class="muted"></div>

      <div class="pager">
        <button class="btn" id="pd-prev">←</button>
        <span id="pd-page" class="muted">1</span>
        <button class="btn" id="pd-next">→</button>
      </div>
    </div>

  </div>
</div>
