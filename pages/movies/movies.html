<div class="card">
  <div class="toolbar">
    <div id="mv-tabs" class="tabs">
      <button class="tab active" data-status="all">Tất cả</button>
      <button class="tab" data-status="now">Đang chiếu</button>
      <button class="tab" data-status="coming">Sắp chiếu</button>
      <button class="tab" data-status="archived">Suất chiếu sớm</button>
    </div>
    <div class="spacer"></div>
    <input id="mv-q" class="search" placeholder="Tìm theo tiêu đề, đạo diễn, diễn viên...">
  </div>

  <div id="mv-table"></div>

  <div class="toolbar" style="justify-content:space-between">
    <div id="mv-info" class="muted"></div>
    <div class="pager">
      <button class="btn" id="mv-prev">‹</button>
      <span id="mv-page">1</span>
      <button class="btn" id="mv-next">›</button>
    </div>
  </div>
</div>
